name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3001
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SENTRY_DSN: ''
      - name: Run tests
        run: npm test -- --run
        env:
          VITE_API_URL: http://localhost:3001
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SENTRY_DSN: ''
